# Compose project name sets the container name prefix (equitable-polling-locations-app-1)
# so it stays stable across Zed restarts instead of auto-generating random names.
name: equitable-polling-locations

services:
    app:
        # Build the image on first container open. VS Code's Dev Containers
        # extension handles this automatically — no manual pre-build step for
        # contributors.
        #
        # Zed caveat: Zed's dev container pipeline has a bug with compose
        # `build:` — it extracts only the Dockerfile's FROM line and skips the
        # rest of the build steps. Zed users should pre-build with
        # `docker compose -f .devcontainer/docker-compose.build.yml build`
        # before opening the project. See CONTRIBUTING.md.
        image: equitable-polling-locations-app:latest
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        volumes:
            - ..:/workspaces/Equitable-Polling-Locations
            # GCP creds mount. run.py sets GCP_CREDS_PATH per-platform (Windows
            # uses %APPDATA%\gcloud); the fallback covers dev container attach
            # where run.py isn't in the loop (HOME on macOS/Linux/WSL2,
            # USERPROFILE on native Windows shells).
            - ${GCP_CREDS_PATH:-${HOME:-${USERPROFILE}}/.config/gcloud}:/home/vscode/.config/gcloud
            # Named volume for gh CLI auth state. Host SSH keys are
            # deliberately NOT mounted — contributors authenticate inside the
            # container via `gh auth login` (device flow), and gh serves as
            # git's HTTPS credential helper. Volume persists auth across
            # container rebuilds. To reset (force re-login):
            # `docker volume rm equitable-polling-locations_gh-config`.
            - gh-config:/home/vscode/.config/gh
            # Named volume for Claude Code state (auth tokens, MCP servers,
            # plugins, session history). Isolated from the host's ~/.claude/
            # because host and container can run different Claude versions,
            # different plugins, and may have different UID/ownership
            # expectations. You'll log in once per container lifecycle; the
            # volume persists across image rebuilds, so it's a one-time cost.
            # To reset: `docker volume rm equitable-polling-locations_claude-state`.
            - claude-state:/home/vscode/.claude
            # Named volume for R's system library. postCreateCommand installs
            # R packages into this path; mounting a volume makes them persist
            # across container recreations, so each `compose down && up` (or
            # image rebuild) doesn't re-run the 15+ min R package compile.
            # To force a clean reinstall: `docker volume rm equitable-polling-locations_r-site-library`.
            - r-site-library:/usr/local/lib/R/site-library
        environment:
            - GOOGLE_APPLICATION_CREDENTIALS=/home/vscode/.config/gcloud/application_default_credentials.json
            - PROJ_LIB=/opt/conda/envs/equitable-polls/share/proj
            - SHAPE_RESTORE_SHX=YES
            - GRPC_DNS_RESOLVER=native
            - PYTHONPATH=/workspaces/Equitable-Polling-Locations
            - PYTHONUNBUFFERED=1
            - PATH=/opt/conda/envs/equitable-polls/bin:/opt/conda/bin:/usr/local/bin:/usr/bin:/bin
        # Keep the container alive for dev container use. The dev containers CLI
        # auto-appends this via overrideCommand, but keeping it explicit lets you
        # `docker compose up` this file standalone.
        command: sleep infinity

volumes:
    # Persistent R package library. See the volume mount on the `app` service
    # above for rationale. Docker will create this volume on first `up`; it
    # survives `docker compose down` but is removed by `docker volume rm` or
    # `docker compose down -v`.
    r-site-library:
    # Persistent Claude Code state (auth + MCP + plugins). Same persistence
    # model as r-site-library; survives rebuilds, cleaned up by explicit
    # `docker volume rm`.
    claude-state:
    # Persistent gh CLI auth state. Contributors run `gh auth login` once
    # per machine (device flow); the saved token lives here.
    gh-config:
