# Sibling ORS service. Brought up separately from the main dev container
# via `python run.py ors_up_cli <state>` (or implicitly by
# `python run.py generate_driving_distances_cli <state> -l <config>`).
# Both compose files set COMPOSE_PROJECT_NAME=polling via .devcontainer/.env
# so the app container can reach this service at http://ors:8080/... over
# the shared network.
#
# ORS v8 listens on port 8082 internally; this file maps host 8080 -> 8082.
# Host-side callers (e.g. ors_up_cli's health poll) use localhost:8080.
#
# The .pbf to load is selected at runtime via the ORS_PBF_FILENAME env var,
# which ors_up_cli sets when invoking `docker compose up -d`. The .pbf must
# exist at datasets/openrouteservice/<filename> before this service starts;
# ors_up_cli downloads it if missing.
services:
  ors:
    image: openrouteservice/openrouteservice:v8.0.0
    container_name: ors
    environment:
      REBUILD_GRAPHS: "false"
      CONTAINER_LOG_LEVEL: INFO
      # The ORS v8 image's launcher reads XMS/XMX env vars directly (defaults
      # 1g/2g) and ignores -Xmx flags passed via JAVA_OPTS, so use these.
      # The 2g default is enough for Georgia (peak ~1.9 GB) but OOMs on
      # bigger state extracts (Texas at ~800 MB needs ~6-10 GB during graph
      # preprocessing). Bump XMX if you swap to a larger state; requires the
      # host's Docker Desktop memory limit to be >= XMX.
      XMS: 2g
      XMX: 10g
      # Explicit source: the container writes example-heidelberg.osm.gz into
      # /home/ors/files on first boot, so auto-detection picks the demo data
      # instead of the .pbf we want. ORS_PBF_FILENAME is set by ors_up_cli
      # based on the positional state arg.
      ors.engine.source_file: /home/ors/files/${ORS_PBF_FILENAME:?ors_up_cli must set ORS_PBF_FILENAME}
    volumes:
      - ../datasets/openrouteservice:/home/ors/files
      - ors_graphs:/home/ors/graphs
      - ors_elevation:/home/ors/elevation_cache
      - ors_logs:/home/ors/logs
    ports:
      - "8080:8082"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8082/ors/v2/health || exit 1
      start_period: 2m
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  ors_graphs:
  ors_elevation:
  ors_logs:
