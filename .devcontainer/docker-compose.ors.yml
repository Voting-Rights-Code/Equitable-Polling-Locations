# Sibling ORS service. Brought up separately from the main dev container
# via `python run.py ors_up_cli`. Both compose files set
# COMPOSE_PROJECT_NAME=polling via .devcontainer/.env so the app container
# can reach this service at http://ors:8080/... over the shared network.
#
# ORS v8 listens on port 8082 internally; this file maps host 8080 -> 8082.
# Host-side callers (e.g. ors_up_cli's health poll) use localhost:8080.
#
# The .pbf is auto-detected from /home/ors/files/. Put exactly one .pbf at
# a time in .devcontainer/ors_data/ (via `python run.py ors_setup_cli --state X`).
# To switch states: `ors_down_cli --purge-graphs`, swap the .pbf, `ors_up_cli`.
services:
  ors:
    image: openrouteservice/openrouteservice:v8.0.0
    container_name: ors
    environment:
      REBUILD_GRAPHS: "false"
      CONTAINER_LOG_LEVEL: INFO
      JVM_MAX_RAM_PERCENTAGE: "75.0"
      # Explicit source: the container writes example-heidelberg.osm.gz into
      # /home/ors/files on first boot, so auto-detection picks the demo data
      # instead of the .pbf we want. Setting source_file forces our file.
      # To switch states, change this filename to match the new .pbf put in
      # .devcontainer/ors_data/ by `python run.py ors_setup_cli --state X`.
      # (Multi-state convenience is filed as a follow-up.)
      ors.engine.source_file: /home/ors/files/georgia-latest.osm.pbf
    volumes:
      - ./ors_data:/home/ors/files
      - ors_graphs:/home/ors/graphs
      - ors_elevation:/home/ors/elevation_cache
      - ors_logs:/home/ors/logs
    ports:
      - "8080:8082"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8082/ors/v2/health || exit 1
      start_period: 2m
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  ors_graphs:
  ors_elevation:
  ors_logs:
